server {
    listen 1001;
    server_name _;

    # Root URL redirects to /web/ because this SPA is built with base=/web/
    location = / {
        return 302 /web/;
    }

    # API proxy to Ktor server container (avoids browser CORS issues)
    location /api/ {
        proxy_pass http://server:1000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media assets served by Ktor server (menu photos, etc)
    location /media/ {
        proxy_pass http://server:1000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React webapp routes and static assets
    location /web/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /web/index.html;
    }
}
